name: Build Youtility EXE

# Ne zaman çalışır:
#   - main'e push / pull request  -> EXE derlenir, "Actions" sekmesinden artifact olarak indirilir
#   - v* etiketi (ör. v5.0.3)     -> derlenir + GitHub Release'e Youtility_win_x64-English.exe eklenir
#   - elle (Actions > Run workflow)
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', 'img/**', 'LICENSE']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'img/**', 'LICENSE']
  workflow_dispatch:

# Aynı dalda yeni bir çalışma başlarsa eskisini iptal et
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows EXE
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller -r requirements.txt

      # Bağımlılıklar gerçekten import edilebiliyor mu? Derlemeden önce hızlı hata ver.
      - name: Check imports
        run: python -c "import PyQt6.QtWidgets, yt_dlp, requests; print('imports ok')"

      - name: Build with PyInstaller
        shell: pwsh
        run: |
          $pyArgs = @(
            '--noconsole', '--onefile', '--windowed',
            '--name', 'Youtility',
            '--icon', 'icon.ico',
            '--add-data', 'icon.ico;.',
            '--collect-all', 'yt_dlp',
            '--hidden-import', 'yt_dlp',
            '--hidden-import', 'yt_dlp.extractor',
            '--hidden-import', 'yt_dlp.extractor.youtube',
            '--hidden-import', 'yt_dlp.utils',
            '--hidden-import', 'yt_dlp.networking',
            '--hidden-import', 'yt_dlp.networking.impersonate',
            '--hidden-import', 'websockets',
            '--hidden-import', 'certifi',
            '--hidden-import', 'urllib3',
            '--hidden-import', 'requests',
            '--hidden-import', 'PyQt6',
            '--hidden-import', 'PyQt6.QtCore',
            '--hidden-import', 'PyQt6.QtWidgets',
            '--hidden-import', 'PyQt6.QtGui',
            'main-en.py'
          )
          pyinstaller @pyArgs
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller basarisiz oldu (kod $LASTEXITCODE)" }

      # Release'lerde kullanılan dosya adına çevir, boyutu doğrula, SHA-256 üret
      - name: Package
        shell: pwsh
        run: |
          $exe = 'dist/Youtility.exe'
          if (-not (Test-Path $exe)) { throw "$exe uretilmedi" }
          $mb = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "Youtility.exe: $mb MB"
          if ($mb -lt 20) { throw "EXE beklenenden cok kucuk ($mb MB) - bagimliliklar pakete girmemis olabilir" }
          Move-Item $exe 'dist/Youtility_win_x64-English.exe'
          $hash = (Get-FileHash -Algorithm SHA256 'dist/Youtility_win_x64-English.exe').Hash.ToLower()
          "$hash  Youtility_win_x64-English.exe" | Set-Content -Path dist/SHA256SUMS.txt -Encoding ascii
          Get-Content dist/SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Youtility-Windows
          path: |
            dist/Youtility_win_x64-English.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

  # Yalnızca v* etiketi itildiğinde çalışır; yazma izni sadece bu işte var.
  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout (sürüm notları için)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Youtility-Windows
          path: out

      # Release zaten varsa (arayüzden oluşturduysan) başlık/açıklamana DOKUNMAZ, sadece dosyayı ekler.
      # Yoksa oluşturur: RELEASE_NOTES_<etiket>.md varsa onu, yoksa otomatik notları kullanır.
      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          files=(out/Youtility_win_x64-English.exe out/SHA256SUMS.txt)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG mevcut - dosyalar ekleniyor"
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            notes="RELEASE_NOTES_${TAG}.md"
            if [ -f "$notes" ]; then
              # Başlık: notların ilk satırındaki "# ..." başlığı (yoksa etiket adı)
              title="$(head -n 1 "$notes" | sed -E 's/^#+[[:space:]]*//; s/\r$//')"
              gh release create "$TAG" "${files[@]}" --title "${title:-$TAG}" --notes-file "$notes"
            else
              gh release create "$TAG" "${files[@]}" --title "$TAG" --generate-notes
            fi
          fi
